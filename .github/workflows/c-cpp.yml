name: C/C++ CI

on: [ push, pull_request ]

jobs:
  build:
    strategy:
      matrix:
        cython: [cython3-legacy, cython3]

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v2
    - name: install cython
      run: |
        sudo apt-get update && sudo apt-get install -y ${{ matrix.cython }}
        cython3 --version
    - name: regenerate python bindings
      run: make -B -C bindings/python/rgbmatrix
    - name: make
      run: make

  windows-emulator:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Configure native headless emulator
      run: cmake -S . -B build -DENABLE_EMULATOR=ON -DBUILD_TESTS=ON
    - name: Build native headless emulator
      run: cmake --build build --config Release
    - name: Test native headless emulator
      run: ctest --test-dir build -C Release --output-on-failure
